<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pet Options</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;padding:48px 32px;font-family:'SF Mono',ui-monospace,monospace}
.sheet{width:1060px}
.header{display:flex;align-items:baseline;gap:16px;margin-bottom:36px}
.header h1{font-size:11px;letter-spacing:3px;color:#555;text-transform:uppercase}
.header span{font-size:10px;color:#333;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#f9f7f3;border-radius:16px;padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;min-height:320px}
.card-label{position:absolute;top:16px;left:20px;font-size:10px;letter-spacing:2px;color:#aaa;text-transform:uppercase}
.char-wrap{display:flex;justify-content:center;align-items:flex-end;height:160px}
.card-title{font-size:13px;letter-spacing:1.5px;color:#222;text-transform:uppercase;font-weight:600}
.card-sub{font-size:10px;letter-spacing:1px;color:#888;text-align:center;line-height:1.6}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.tag{font-size:8.5px;letter-spacing:1px;color:#999;background:#eee;padding:2px 8px;border-radius:20px;text-transform:uppercase}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes jiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes blink-mask{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
@keyframes wave-arm{0%,100%{transform:rotate(-75deg)}50%{transform:rotate(-40deg)}}
@keyframes ink-drip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
@keyframes pixel-blink{0%,88%,100%{opacity:1}93%{opacity:0}}
</style>
</head>
<body>
<div class="sheet">
  <div class="header">
    <h1>Atlas Pet · Style Options</h1>
    <span>选择你喜欢的风格</span>
  </div>
  <div class="grid">

    <!-- ─── A · 极简几何 ─────────────────────────────────────── -->
    <div class="card">
      <div class="card-label">A</div>
      <div class="char-wrap">
        <svg viewBox="0 0 80 105" width="108" height="142" style="display:block;animation:bob 2.2s ease-in-out infinite">
          <defs>
            <radialGradient id="yg" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ffe566"/>
              <stop offset="100%" stop-color="#d4a000"/>
            </radialGradient>
          </defs>
          <!-- shadow -->
          <ellipse cx="40" cy="103" rx="22" ry="3.5" fill="rgba(0,0,0,0.18)"/>
          <!-- legs -->
          <rect x="22" y="82" width="12" height="18" rx="6" fill="#d4a000"/>
          <rect x="46" y="82" width="12" height="18" rx="6" fill="#d4a000"/>
          <!-- feet -->
          <rect x="18" y="94" width="18" height="8" rx="4" fill="#c09000"/>
          <rect x="44" y="94" width="18" height="8" rx="4" fill="#c09000"/>
          <!-- body -->
          <rect x="18" y="52" width="44" height="36" rx="10" fill="url(#yg)"/>
          <!-- chest display -->
          <rect x="24" y="58" width="32" height="22" rx="5" fill="#f0c028"/>
          <circle cx="33" cy="67" r="3.5" fill="#4ade80" opacity="0.9"/>
          <circle cx="40" cy="67" r="3.5" fill="#f59e0b" opacity="0.9"/>
          <circle cx="47" cy="67" r="3.5" fill="#f87171" opacity="0.9"/>
          <!-- arms -->
          <rect x="4" y="56" width="12" height="10" rx="5" fill="#d4a000"/>
          <rect x="64" y="56" width="12" height="10" rx="5" fill="#d4a000"/>
          <circle cx="8" cy="70" r="7" fill="url(#yg)"/>
          <circle cx="72" cy="70" r="7" fill="url(#yg)"/>
          <!-- HEAD -->
          <rect x="16" y="12" width="48" height="44" rx="12" fill="url(#yg)"/>
          <!-- antenna -->
          <line x1="40" y1="12" x2="40" y2="4" stroke="#c09000" stroke-width="2.5"/>
          <circle cx="40" cy="3" r="3.5" fill="#f5c030"/>
          <!-- pixel eyes -->
          <rect x="22" y="22" width="12" height="12" rx="2.5" fill="#1a1a1a"/>
          <rect x="46" y="22" width="12" height="12" rx="2.5" fill="#1a1a1a"/>
          <rect x="23.5" y="23.5" width="4" height="4" fill="rgba(255,255,255,0.45)"/>
          <rect x="47.5" y="23.5" width="4" height="4" fill="rgba(255,255,255,0.45)"/>
          <!-- mouth bar -->
          <rect x="28" y="40" width="24" height="4" rx="2" fill="rgba(0,0,0,0.15)"/>
          <rect x="30" y="41" width="8" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
        </svg>
      </div>
      <div class="card-title">极简几何</div>
      <div class="card-sub">Swiss grid 同款机器人<br>方正、精准、科技感</div>
      <div class="card-tags"><span class="tag">几何</span><span class="tag">科技</span><span class="tag">黄色</span></div>
    </div>

    <!-- ─── B · 橡皮管复古 ──────────────────────────────────── -->
    <div class="card">
      <div class="card-label">B</div>
      <div class="char-wrap">
        <svg viewBox="0 0 110 130" width="110" height="130" style="display:block;animation:jiggle 3s ease-in-out infinite">
          <!-- shadow -->
          <ellipse cx="55" cy="127" rx="28" ry="4.5" fill="rgba(0,0,0,0.25)"/>
          <!-- body -->
          <ellipse cx="55" cy="90" rx="30" ry="30" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- head -->
          <circle cx="55" cy="50" r="36" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- left eye -->
          <circle cx="41" cy="45" r="15" fill="white" stroke="#1c1c1c" stroke-width="2.2"/>
          <circle cx="41" cy="47" r="8.5" fill="#1c1c1c"/>
          <circle cx="37.5" cy="43.5" r="3.8" fill="white"/>
          <!-- right eye -->
          <circle cx="69" cy="45" r="15" fill="white" stroke="#1c1c1c" stroke-width="2.2"/>
          <circle cx="69" cy="47" r="8.5" fill="#1c1c1c"/>
          <circle cx="65.5" cy="43.5" r="3.8" fill="white"/>
          <!-- eyebrows -->
          <path d="M29 30 Q41 24 53 30" fill="none" stroke="#1c1c1c" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M57 30 Q69 24 81 30" fill="none" stroke="#1c1c1c" stroke-width="2.8" stroke-linecap="round"/>
          <!-- smile -->
          <path d="M41 62 Q55 72 69 62" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
          <!-- blush -->
          <ellipse cx="25" cy="56" rx="7.5" ry="5" fill="#ff8c8c" opacity="0.38"/>
          <ellipse cx="85" cy="56" rx="7.5" ry="5" fill="#ff8c8c" opacity="0.38"/>
          <!-- left arm (rubber hose) -->
          <path d="M27 80 Q8 68 5 82" stroke="#f8f4ec" stroke-width="14" fill="none" stroke-linecap="round"/>
          <path d="M27 80 Q8 68 5 82" stroke="#1c1c1c" stroke-width="16.5" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="5" cy="84" r="10" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.2"/>
          <!-- right arm (rubber hose) wave -->
          <g style="transform-origin:83px 80px;animation:wave-arm 0.7s ease-in-out infinite">
            <path d="M83 80 Q100 60 98 50" stroke="#f8f4ec" stroke-width="14" fill="none" stroke-linecap="round"/>
            <path d="M83 80 Q100 60 98 50" stroke="#1c1c1c" stroke-width="16.5" fill="none" stroke-linecap="round" opacity="0.12"/>
            <circle cx="98" cy="48" r="10" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.2"/>
          </g>
          <!-- legs -->
          <path d="M43 115 Q40 126 34 127" stroke="#f8f4ec" stroke-width="13" fill="none" stroke-linecap="round"/>
          <path d="M43 115 Q40 126 34 127" stroke="#1c1c1c" stroke-width="15.5" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="33" cy="127" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.2"/>
          <path d="M67 115 Q70 126 76 127" stroke="#f8f4ec" stroke-width="13" fill="none" stroke-linecap="round"/>
          <path d="M67 115 Q70 126 76 127" stroke="#1c1c1c" stroke-width="15.5" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="77" cy="127" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.2"/>
        </svg>
      </div>
      <div class="card-title">橡皮管复古</div>
      <div class="card-sub">1950s 经典卡通风格<br>圆润大眼、黑白轮廓</div>
      <div class="card-tags"><span class="tag">复古</span><span class="tag">黑白</span><span class="tag">圆润</span></div>
    </div>

    <!-- ─── C · 墨水精灵 ──────────────────────────────────── -->
    <div class="card">
      <div class="card-label">C</div>
      <div class="char-wrap">
        <svg viewBox="0 0 100 128" width="110" height="140" style="display:block;animation:float 3s ease-in-out infinite">
          <!-- drip shadows -->
          <ellipse cx="50" cy="126" rx="22" ry="4" fill="rgba(0,0,0,0.28)"/>
          <!-- ink drips bottom -->
          <path d="M36 108 Q35 118 35.5 122" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M50 112 Q50 120 50 124" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M64 108 Q65 118 64.5 122" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- blob body (organic shape) -->
          <path d="M50 8 C74 8 90 22 92 44 C94 62 86 76 80 90 C74 104 64 112 50 112 C36 112 26 104 20 90 C14 76 6 62 8 44 C10 22 26 8 50 8 Z" fill="#111"/>
          <!-- subtle sheen on blob -->
          <ellipse cx="34" cy="26" rx="10" ry="7" fill="rgba(255,255,255,0.07)" transform="rotate(-20 34 26)"/>
          <!-- Left eye (glowing) -->
          <circle cx="37" cy="52" r="13.5" fill="white" opacity="0.96"/>
          <circle cx="37" cy="53" r="7" fill="#111"/>
          <circle cx="34" cy="49.5" r="3" fill="white"/>
          <!-- Right eye (glowing) -->
          <circle cx="63" cy="52" r="13.5" fill="white" opacity="0.96"/>
          <circle cx="63" cy="53" r="7" fill="#111"/>
          <circle cx="60" cy="49.5" r="3" fill="white"/>
          <!-- tiny quill pen it's holding -->
          <line x1="74" y1="85" x2="90" y2="58" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M90 58 L84 52 L88 64 Z" fill="rgba(255,255,255,0.6)"/>
          <!-- floating ink dots -->
          <circle cx="16" cy="45" r="4" fill="#111" opacity="0.6"/>
          <circle cx="10" cy="58" r="2.5" fill="#111" opacity="0.4"/>
          <circle cx="86" cy="38" r="3" fill="#111" opacity="0.5"/>
          <circle cx="92" cy="55" r="2" fill="#111" opacity="0.35"/>
        </svg>
      </div>
      <div class="card-title">墨水精灵</div>
      <div class="card-sub">住在报告里的墨水生灵<br>黑底白眼、发光眼神</div>
      <div class="card-tags"><span class="tag">编辑</span><span class="tag">黑色</span><span class="tag">神秘</span></div>
    </div>

    <!-- ─── D · 猫咪助手 ──────────────────────────────────── -->
    <div class="card">
      <div class="card-label">D</div>
      <div class="char-wrap">
        <svg viewBox="0 0 100 122" width="112" height="137" style="display:block;animation:bob 2.8s ease-in-out infinite">
          <!-- shadow -->
          <ellipse cx="50" cy="120" rx="24" ry="4" fill="rgba(0,0,0,0.14)"/>
          <!-- tail -->
          <path d="M74 100 Q96 88 92 72 Q88 58 78 64" stroke="#e8e0d8" stroke-width="11" fill="none" stroke-linecap="round"/>
          <!-- body -->
          <ellipse cx="50" cy="85" rx="25" ry="28" fill="#ede8e0"/>
          <!-- belly -->
          <ellipse cx="50" cy="90" rx="15" ry="19" fill="#fdfaf7"/>
          <!-- left paw -->
          <ellipse cx="28" cy="100" rx="11" ry="8" fill="#e0d8ce"/>
          <ellipse cx="38" cy="108" rx="11" ry="8" fill="#e0d8ce"/>
          <!-- right paw -->
          <ellipse cx="72" cy="100" rx="11" ry="8" fill="#e0d8ce"/>
          <ellipse cx="62" cy="108" rx="11" ry="8" fill="#e0d8ce"/>
          <!-- tiny doc on lap -->
          <rect x="33" y="100" width="34" height="22" rx="3" fill="white" stroke="rgba(0,0,0,0.12)" stroke-width="1.2"/>
          <line x1="37" y1="105" x2="63" y2="105" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
          <line x1="37" y1="109" x2="63" y2="109" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
          <line x1="37" y1="113" x2="55" y2="113" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
          <!-- head -->
          <circle cx="50" cy="45" r="33" fill="#ede8e0"/>
          <!-- ears -->
          <polygon points="20,24 30,2 40,26" fill="#ede8e0"/>
          <polygon points="24,23 30,8 38,25" fill="#f5b8c0"/>
          <polygon points="60,26 70,2 80,24" fill="#ede8e0"/>
          <polygon points="62,25 70,8 76,23" fill="#f5b8c0"/>
          <!-- reading glasses -->
          <circle cx="37" cy="44" r="9.5" fill="none" stroke="#8B7355" stroke-width="1.8" opacity="0.7"/>
          <circle cx="63" cy="44" r="9.5" fill="none" stroke="#8B7355" stroke-width="1.8" opacity="0.7"/>
          <line x1="46.5" y1="44" x2="53.5" y2="44" stroke="#8B7355" stroke-width="1.8" opacity="0.7"/>
          <line x1="17" y1="43" x2="27.5" y2="44" stroke="#8B7355" stroke-width="1.8" opacity="0.7"/>
          <line x1="72.5" y1="44" x2="83" y2="43" stroke="#8B7355" stroke-width="1.8" opacity="0.7"/>
          <!-- eyes behind glasses -->
          <ellipse cx="37" cy="44" rx="5.5" ry="6.5" fill="#2a5a3c"/>
          <ellipse cx="63" cy="44" rx="5.5" ry="6.5" fill="#2a5a3c"/>
          <ellipse cx="37" cy="44" rx="3.2" ry="4.8" fill="#111"/>
          <ellipse cx="63" cy="44" rx="3.2" ry="4.8" fill="#111"/>
          <circle cx="34.5" cy="41.5" r="2" fill="rgba(255,255,255,0.85)"/>
          <circle cx="60.5" cy="41.5" r="2" fill="rgba(255,255,255,0.85)"/>
          <!-- nose -->
          <path d="M47 56 L50 60 L53 56 Z" fill="#f5a0b5" opacity="0.85"/>
          <!-- mouth -->
          <path d="M46 61 Q50 65 54 61" fill="none" stroke="#d4889a" stroke-width="1.6" stroke-linecap="round"/>
          <!-- whiskers -->
          <line x1="16" y1="53" x2="42" y2="56" stroke="rgba(0,0,0,0.18)" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="16" y1="58" x2="42" y2="58.5" stroke="rgba(0,0,0,0.18)" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="58" y1="56" x2="84" y2="53" stroke="rgba(0,0,0,0.18)" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="58" y1="58.5" x2="84" y2="58" stroke="rgba(0,0,0,0.18)" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-title">猫咪助手</div>
      <div class="card-sub">戴眼镜的编辑猫<br>捧着报告审稿中</div>
      <div class="card-tags"><span class="tag">可爱</span><span class="tag">专业</span><span class="tag">暖色</span></div>
    </div>

    <!-- ─── E · 幽灵写手 ──────────────────────────────────── -->
    <div class="card">
      <div class="card-label">E</div>
      <div class="char-wrap">
        <svg viewBox="0 0 100 130" width="108" height="140" style="display:block;animation:float 2.6s ease-in-out infinite">
          <!-- glow under -->
          <ellipse cx="50" cy="126" rx="20" ry="5" fill="rgba(100,200,255,0.2)"/>
          <!-- ghost body (rounded top, wavy bottom) -->
          <path d="M50 10 C26 10 14 28 14 52 L14 100 Q20 92 26 100 Q32 108 38 100 Q44 92 50 100 Q56 108 62 100 Q68 92 74 100 Q80 108 86 100 L86 52 C86 28 74 10 50 10 Z"
                fill="white" opacity="0.96"/>
          <!-- subtle gradient overlay -->
          <path d="M50 12 C28 12 16 28 16 52 L16 98 Q22 90 28 98 Q34 106 40 98 Q46 90 52 98 Q58 106 64 98 Q70 90 76 98 Q82 106 84 98 L84 52 C84 28 72 12 50 12 Z"
                fill="url(#ghostGrad)" opacity="0.4"/>
          <defs>
            <radialGradient id="ghostGrad" cx="38%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#b8eeff"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <!-- eyes (cute ovals) -->
          <ellipse cx="37" cy="52" rx="9" ry="11" fill="#1a1a1a"/>
          <ellipse cx="63" cy="52" rx="9" ry="11" fill="#1a1a1a"/>
          <ellipse cx="34.5" cy="49" rx="3" ry="3.8" fill="rgba(255,255,255,0.7)"/>
          <ellipse cx="60.5" cy="49" rx="3" ry="3.8" fill="rgba(255,255,255,0.7)"/>
          <!-- small o-mouth -->
          <ellipse cx="50" cy="66" rx="5" ry="5.5" fill="#1a1a1a"/>
          <!-- blush -->
          <ellipse cx="24" cy="60" rx="7" ry="4.5" fill="#ffaaaa" opacity="0.4"/>
          <ellipse cx="76" cy="60" rx="7" ry="4.5" fill="#ffaaaa" opacity="0.4"/>
          <!-- tiny pen floating alongside -->
          <g transform="translate(74,28) rotate(28)">
            <rect x="0" y="0" width="5" height="22" rx="2.5" fill="#f5c030"/>
            <polygon points="0,22 5,22 2.5,28" fill="#1a1a1a"/>
            <rect x="0" y="0" width="5" height="5" rx="2" fill="#d4a000"/>
          </g>
          <!-- sparkles -->
          <text x="8" y="38" font-size="12" fill="rgba(100,200,255,0.7)">✦</text>
          <text x="82" y="45" font-size="9" fill="rgba(100,200,255,0.5)">✦</text>
          <text x="14" y="80" font-size="7" fill="rgba(100,200,255,0.4)">✦</text>
        </svg>
      </div>
      <div class="card-title">幽灵写手</div>
      <div class="card-sub">报告里飘出的小幽灵<br>漂浮感、冷酷感十足</div>
      <div class="card-tags"><span class="tag">轻盈</span><span class="tag">白色</span><span class="tag">神秘</span></div>
    </div>

    <!-- ─── F · 圆滚滚 ──────────────────────────────────── -->
    <div class="card">
      <div class="card-label">F</div>
      <div class="char-wrap">
        <svg viewBox="0 0 100 110" width="118" height="130" style="display:block;animation:bob 1.8s ease-in-out infinite">
          <defs>
            <radialGradient id="blobG" cx="36%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#c4b5fd"/>
              <stop offset="60%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#4c1d95"/>
            </radialGradient>
            <radialGradient id="blobG2" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#ddd6fe"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </radialGradient>
          </defs>
          <!-- shadow -->
          <ellipse cx="50" cy="107" rx="30" ry="5" fill="rgba(100,50,200,0.22)"/>
          <!-- tiny nub feet -->
          <ellipse cx="36" cy="100" rx="10" ry="7" fill="#6d28d9"/>
          <ellipse cx="64" cy="100" rx="10" ry="7" fill="#6d28d9"/>
          <!-- main round body (huge circle) -->
          <circle cx="50" cy="55" r="46" fill="url(#blobG)"/>
          <!-- highlight -->
          <ellipse cx="34" cy="36" rx="14" ry="9" fill="rgba(255,255,255,0.18)" transform="rotate(-22 34 36)"/>
          <!-- tiny nub arms -->
          <ellipse cx="8" cy="58" rx="9" ry="11" fill="#6d28d9" transform="rotate(-20 8 58)"/>
          <ellipse cx="92" cy="58" rx="9" ry="11" fill="#6d28d9" transform="rotate(20 92 58)"/>
          <!-- BIG round eyes -->
          <circle cx="37" cy="52" r="14" fill="white"/>
          <circle cx="63" cy="52" r="14" fill="white"/>
          <circle cx="37" cy="54" r="8.5" fill="#1a1a1a"/>
          <circle cx="63" cy="54" r="8.5" fill="#1a1a1a"/>
          <!-- star-shaped pupils -->
          <circle cx="37" cy="54" r="4.8" fill="#111"/>
          <circle cx="63" cy="54" r="4.8" fill="#111"/>
          <!-- eye shine -->
          <circle cx="33" cy="50" r="3.5" fill="white"/>
          <circle cx="59" cy="50" r="3.5" fill="white"/>
          <circle cx="39.5" cy="57" r="1.8" fill="rgba(255,255,255,0.5)"/>
          <circle cx="65.5" cy="57" r="1.8" fill="rgba(255,255,255,0.5)"/>
          <!-- UwU mouth -->
          <path d="M42 68 Q50 74 58 68" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
          <!-- blush stars -->
          <text x="17" y="72" font-size="11" fill="rgba(255,200,255,0.7)">✦</text>
          <text x="73" y="72" font-size="11" fill="rgba(255,200,255,0.7)">✦</text>
        </svg>
      </div>
