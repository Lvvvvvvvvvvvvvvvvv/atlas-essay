name: Deploy redirect to Vercel

# GitHub Pages can't host the backend (/api/*) or build-time Supabase env,
# so the static demo never worked end-to-end. Instead of publishing a broken
# static build, publish a redirect page that bounces the old github.io demo
# link to the fully-working Vercel deployment.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Generate redirect site
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Atlas Report Agent</title>
            <link rel="canonical" href="https://atlas-essay.vercel.app/">
            <meta http-equiv="refresh" content="0; url=https://atlas-essay.vercel.app/">
            <script>
              location.replace("https://atlas-essay.vercel.app/" + location.search + location.hash);
            </script>
            <style>
              html,body{height:100%;margin:0}
              body{display:flex;align-items:center;justify-content:center;background:#fbf9f4;color:#0f0f0f;
                   font-family:Arial,'WenQuanYi Zen Hei',sans-serif}
              .box{text-align:center;max-width:480px;padding:32px}
              .tag{font-family:monospace;font-size:11px;letter-spacing:2px;color:#767368;text-transform:uppercase}
              h1{font-weight:900;font-size:40px;letter-spacing:-1px;margin:10px 0 6px}
              h1 em{font-style:italic;color:#e5251d}
              p{font-size:14px;color:#555;line-height:1.7}
              a{display:inline-block;margin-top:18px;padding:10px 22px;background:#0f0f0f;color:#fbf9f4;
                text-decoration:none;font-family:monospace;font-size:12px;letter-spacing:1px;box-shadow:3px 3px 0 #e5251d}
            </style>
          </head>
          <body>
            <div class="box">
              <div class="tag">ATLAS REPORT AGENT</div>
              <h1>Atlas <em>Report</em></h1>
              <p>正式站点已迁移至 Vercel（含完整后端、团队协作与生成功能）。<br>正在跳转…若未自动跳转，请点击下方。</p>
              <a href="https://atlas-essay.vercel.app/">前往 atlas-essay.vercel.app →</a>
            </div>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Deploy redirect to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
