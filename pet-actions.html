<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rubber Hose Actions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;justify-content:center;padding:44px 28px;font-family:'SF Mono',ui-monospace,monospace}
.sheet{width:1060px}
.header{display:flex;align-items:baseline;gap:14px;margin-bottom:32px}
.header h1{font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase}
.header span{font-size:10px;color:#333}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#f9f7f3;border-radius:14px;padding:28px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;min-height:280px}
.num{position:absolute;top:14px;left:18px;font-size:9px;letter-spacing:2px;color:#bbb;text-transform:uppercase}
.char-wrap{display:flex;justify-content:center;align-items:flex-end;height:150px}
.name{font-size:12px;letter-spacing:2px;color:#222;font-weight:600;text-transform:uppercase}
.desc{font-size:9.5px;color:#888;text-align:center;line-height:1.7;letter-spacing:0.5px}

@keyframes bob      {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes walk     {0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes run      {0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes dance    {0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-9px)}}
@keyframes sleep    {0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-7deg)}}
@keyframes wave-arm {0%,100%{transform:rotate(-80deg)}50%{transform:rotate(-45deg)}}
@keyframes strum    {0%,100%{transform:rotate(10deg)}50%{transform:rotate(-8deg)}}
@keyframes think-tap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-10deg)}}
@keyframes bounce   {0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-14px) scale(1.04,0.96)}}
</style>
</head>
<body>
<div class="sheet">
  <div class="header">
    <h1>B · 橡皮管复古 · 动作方案</h1>
    <span>9个动作状态 · 确认后开始制作</span>
  </div>
  <div class="grid">

    <!-- 1. 待机 IDLE ─────────────────────────────────────── -->
    <div class="card">
      <div class="num">01</div>
      <div class="char-wrap">
        <svg viewBox="0 0 110 132" width="112" height="135" style="display:block;animation:bob 2.4s ease-in-out infinite">
          <ellipse cx="55" cy="130" rx="26" ry="4" fill="rgba(0,0,0,0.2)"/>
          <!-- legs -->
          <path d="M44 108 Q38 120 36 127" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M44 108 Q38 120 36 127" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="36" cy="127" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <path d="M66 108 Q72 120 74 127" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M66 108 Q72 120 74 127" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="74" cy="127" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- body -->
          <ellipse cx="55" cy="85" rx="26" ry="27" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- arms -->
          <path d="M30 80 Q14 85 10 96" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M30 80 Q14 85 10 96" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="10" cy="96" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <path d="M80 80 Q96 85 100 96" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M80 80 Q96 85 100 96" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="100" cy="96" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- head -->
          <circle cx="55" cy="41" r="34" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- eyes -->
          <circle cx="41" cy="37" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <circle cx="41" cy="39" r="7" fill="#1c1c1c"/>
          <circle cx="38" cy="35.5" r="3" fill="white"/>
          <circle cx="69" cy="37" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <circle cx="69" cy="39" r="7" fill="#1c1c1c"/>
          <circle cx="66" cy="35.5" r="3" fill="white"/>

          <path d="M30 22 Q41 16 52 21" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M58 21 Q69 16 80 22" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
          <!-- blush subtle -->
          <ellipse cx="24" cy="50" rx="7" ry="4.5" fill="#ff9090" opacity="0.3"/>
          <ellipse cx="86" cy="50" rx="7" ry="4.5" fill="#ff9090" opacity="0.3"/>
          <!-- small smile -->
          <path d="M42 55 Q55 62 68 55" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="name">待机</div>
      <div class="desc">上下轻浮 · 眨眨眼<br>眼神四处溜达</div>
    </div>

    <!-- 2. 走路 WALK ─────────────────────────────────────── -->
    <div class="card">
      <div class="num">02</div>
      <div class="char-wrap">

          <ellipse cx="58" cy="130" rx="26" ry="4" fill="rgba(0,0,0,0.2)"/>
          <!-- leg back (L) -->
          <path d="M46 108 Q34 118 28 125" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M46 108 Q34 118 28 125" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="28" cy="125" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>

          <circle cx="14" cy="56" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- arm back (R) -->
          <path d="M83 80 Q98 88 104 96" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M83 80 Q98 88 104 96" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="104" cy="96" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>

          <circle cx="44" cy="36" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <circle cx="45" cy="38" r="7" fill="#1c1c1c"/>
          <circle cx="41" cy="34" r="3" fill="white"/>
          <circle cx="72" cy="36" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <circle cx="73" cy="38" r="7" fill="#1c1c1c"/>
          <circle cx="69" cy="34" r="3" fill="white"/>
          <!-- happy brows -->
          <path d="M32 20 Q44 14 56 20" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M60 20 Q72 14 84 20" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="28" cy="49" rx="7" ry="4.5" fill="#ff9090" opacity="0.42"/>
          <ellipse cx="88" cy="49" rx="7" ry="4.5" fill="#ff9090" opacity="0.42"/>
          <path d="M44 54 Q58 62 72 54" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="name">走路</div>
      <div class="desc">橡皮管摆手走路<br>身体微微前倾</div>
    </div>

    <!-- 3. 跑步 RUN ─────────────────────────────────────── -->

          <line x1="2" y1="80" x2="16" y2="80" stroke="#eee" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="6" y1="90" x2="18" y2="90" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
          <!-- legs split wide -->
          <path d="M47 108 Q32 114 22 118" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M47 108 Q32 114 22 118" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="22" cy="118" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <path d="M69 108 Q84 100 92 94" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M69 108 Q84 100 92 94" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="92" cy="94" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- body leaned forward -->
          <ellipse cx="60" cy="84" rx="26" ry="27" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8" transform="rotate(-8 60 84)"/>
          <!-- arms pumping -->
          <path d="M35 76 Q18 60 12 52" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M35 76 Q18 60 12 52" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="12" cy="52" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <path d="M85 76 Q102 90 108 100" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M85 76 Q102 90 108 100" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="108" cy="100" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- head (leaned forward, excited) -->
          <circle cx="60" cy="40" r="34" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- star/speed eyes -->
          <circle cx="46" cy="36" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <circle cx="47" cy="37" r="7.5" fill="#1c1c1c"/>
          <circle cx="43.5" cy="33.5" r="3.5" fill="white"/>
          <circle cx="74" cy="36" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <circle cx="75" cy="37" r="7.5" fill="#1c1c1c"/>
          <circle cx="71.5" cy="33.5" r="3.5" fill="white"/>

          <path d="M62 18 Q74 12 86 20" fill="none" stroke="#1c1c1c" stroke-width="2.8" stroke-linecap="round"/>
          <!-- big grin -->
          <path d="M40 53 Q60 68 80 53" fill="none" stroke="#1c1c1c" stroke-width="2.8" stroke-linecap="round"/>
          <!-- teeth -->
          <path d="M43 53 Q60 64 77 53" fill="white" opacity="0.8"/>
          <ellipse cx="28" cy="48" rx="7.5" ry="5" fill="#ff7777" opacity="0.55"/>
          <ellipse cx="92" cy="48" rx="7.5" ry="5" fill="#ff7777" opacity="0.55"/>
        </svg>
      </div>
      <div class="name">跑步</div>
      <div class="desc">速度线 · 身体大幅前倾<br>四肢摆动夸张</div>
    </div>

    <!-- 4. 跳舞 DANCE ─────────────────────────────────────── -->
    <div class="card">
      <div class="num">04</div>
      <div class="char-wrap">
        <svg viewBox="0 0 130 135" width="128" height="133" style="display:block;animation:dance 0.55s ease-in-out infinite">
          <ellipse cx="62" cy="133" rx="24" ry="4" fill="rgba(0,0,0,0.18)"/>

          <path d="M47 108 Q40 98 42 90" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M47 108 Q40 98 42 90" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="42" cy="90" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- right foot planted -->
          <path d="M68 108 Q76 118 80 126" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M68 108 Q76 118 80 126" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="80" cy="126" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- body -->
          <ellipse cx="62" cy="85" rx="26" ry="27" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- arms spread wide+up -->
          <path d="M37 78 Q18 55 10 44" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M37 78 Q18 55 10 44" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="10" cy="44" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <path d="M87 78 Q106 55 116 44" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M87 78 Q106 55 116 44" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="116" cy="44" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>

          <circle cx="62" cy="40" r="34" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- star eyes for dance -->
          <circle cx="48" cy="36" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <text x="40" y="42" font-size="14" fill="#1c1c1c">★</text>
          <circle cx="76" cy="36" r="12.5" fill="white" stroke="#1c1c1c" stroke-width="2"/>
          <text x="68" y="42" font-size="14" fill="#1c1c1c">★</text>

          <ellipse cx="92" cy="50" rx="8" ry="5" fill="#ff6666" opacity="0.6"/>

        </svg>
      </div>
      <div class="name">跳舞</div>
      <div class="desc">星星眼 · 手臂高举<br>单腿抬起嗨起来</div>
    </div>

    <!-- 5. 睡觉 SLEEP ─────────────────────────────────────── -->
    <div class="card">
      <div class="num">05</div>
      <div class="char-wrap">
        <svg viewBox="0 0 110 132" width="112" height="135" style="display:block;animation:sleep 3s ease-in-out infinite">

          <path d="M66 108 Q68 120 68 128" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>

          <path d="M80 82 Q96 94 100 106" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>

          <!-- head tilted -->
          <circle cx="55" cy="41" r="34" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.8"/>
          <!-- closed eyes (fat arcs) -->
          <path d="M28 40 Q41 54 54 40" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
          <path d="M56 40 Q69 54 82 40" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>

          <!-- drool (optional cute detail) -->

          <!-- ZZZ -->
          <text x="74" y="22" font-family="Georgia,serif" font-size="12" fill="#c0c0c0">z</text>
          <text x="82" y="12" font-family="Georgia,serif" font-size="17" fill="#b0b0b0">Z</text>
          <text x="92" y="3" font-family="Georgia,serif" font-size="21" fill="#a0a0a0">Z</text>
        </svg>
      </div>
      <div class="name">睡觉</div>
      <div class="desc">眼睛变弧线 · ZZZ渐大<br>轻微口水线</div>
    </div>

    <!-- 6. 挥手 WAVE ─────────────────────────────────────── -->
    <div class="card">
      <div class="num">06</div>
      <div class="char-wrap">
        <svg viewBox="0 0 118 132" width="118" height="132" style="display:block;animation:bob 2s ease-in-out infinite">
          <ellipse cx="55" cy="130" rx="26" ry="4" fill="rgba(0,0,0,0.2)"/>
          <path d="M44 108 Q38 120 36 127" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>

          <circle cx="36" cy="127" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <path d="M66 108 Q72 120 74 127" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M66 108 Q72 120 74 127" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>

          <!-- left arm side -->
          <path d="M30 80 Q14 88 10 98" stroke="#f8f4ec" stroke-width="12.5" fill="none" stroke-linecap="round"/>
          <path d="M30 80 Q14 88 10 98" stroke="#1c1c1c" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.12"/>
          <circle cx="10" cy="98" r="9" fill="#f8f4ec" stroke="#1c1c1c" stroke-width="2.5"/>
          <!-- right arm waving HIGH (animated) -->
