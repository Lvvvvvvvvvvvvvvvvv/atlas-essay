<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pet Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'SF Mono', monospace;
}
.card {
  background: #f8f6f0;
  padding: 48px 56px;
  border-radius: 24px;
  box-shadow: 0 16px 64px rgba(0,0,0,0.5);
}
h2 {
  font-size: 10px;
  letter-spacing: 3px;
  color: #888;
  text-align: center;
  margin-bottom: 40px;
  text-transform: uppercase;
}
.grid {
  display: flex;
  gap: 40px;
  align-items: flex-end;
  justify-content: center;
}
.col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.label {
  font-size: 9px;
  letter-spacing: 2px;
  color: #aaa;
  text-transform: uppercase;
}
.ref-note {
  font-size: 10px;
  color: #888;
  text-align: center;
  margin-top: 32px;
  letter-spacing: 1px;
}

/* animations for the animated states */
@keyframes blink { 0%,45%,55%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.05)} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
@keyframes walk-bounce { 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(-4px) rotate(-2deg)} 75%{transform:translateY(-2px) rotate(2deg)} }
@keyframes tail-wag { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
@keyframes arm-wave { 0%,100%{transform:rotate(-80deg)} 50%{transform:rotate(-45deg)} }
@keyframes dance { 0%,100%{transform:rotate(-4deg) translateY(0)} 50%{transform:rotate(4deg) translateY(-6px)} }
</style>
</head>
